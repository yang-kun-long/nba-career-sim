name: Refresh NBA Data

on:
  schedule:
    # GitHub cron uses UTC; 18:00 UTC is 02:00 the next day in Beijing.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: NBA season passed to stats.nba.com (for example 2025-26)
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: nba-data-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    name: Refresh and deploy static NBA snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NBA_SEASON: ${{ github.event.inputs.season || vars.NBA_SEASON || '' }}
      NBA_PROXY_URL: http://127.0.0.1:7890
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install NBA data dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Download Mihomo
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz
          echo 'cf06ce2c7d1421bdbda14ee4a5b6046672dc35ebf8eecd8e77504ec3c0ed9a84  /tmp/mihomo.gz' | sha256sum -c -
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo

      - name: Start NBA proxy and select a compatible node
        env:
          CLASH_SUBSCRIPTION_URL: ${{ secrets.CLASH_SUBSCRIPTION_URL }}
        run: python scripts/start_nba_proxy.py --mihomo /tmp/mihomo --workdir /tmp/nba-mihomo

      - name: Fetch, normalize, and validate NBA data
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "NBA data refresh attempt ${attempt}/3"
            if python scripts/refresh_nba_data.py --output public/data --season "$NBA_SEASON" --proxy "$NBA_PROXY_URL"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 120))
              echo "Attempt ${attempt} failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "NBA data refresh failed after 3 outer attempts" >&2
          exit 1

      - name: Stop NBA proxy
        if: always()
        run: |
          if [ -f /tmp/nba-mihomo/mihomo.pid ]; then
            kill "$(cat /tmp/nba-mihomo/mihomo.pid)" || true
          fi

      - name: Build and validate NBA career indexes
        run: |
          python scripts/build_nba_history_indexes.py --data-root public/data --merge-current --season "$NBA_SEASON"
          python scripts/build_nba_history_indexes.py --data-root public/data --check

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name nba-career-sim --branch main

      - name: Notify refresh failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[NBA data refresh] 自动刷新失败';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `自动刷新在北京时间 ${new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })} 失败。`,
              '',
              `本次运行：${runUrl}`,
              '已保留上一份成功发布的静态快照，未执行 Cloudflare 部署。',
              '',
              '请查看失败步骤日志；NBA.com 接口可能需要稍后重试。'
            ].join('\\n');
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            });
            if (search.data.total_count > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: search.data.items[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
