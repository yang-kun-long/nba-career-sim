name: Proxy subscription diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUB_1: ${{ secrets.PROXY_SUB_TEST_1 }}
      SUB_2: ${{ secrets.PROXY_SUB_TEST_2 }}
      SUB_3: ${{ secrets.PROXY_SUB_TEST_3 }}
    steps:
      - name: Download Mihomo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz
          echo 'cf06ce2c7d1421bdbda14ee4a5b6046672dc35ebf8eecd8e77504ec3c0ed9a84  /tmp/mihomo.gz' | sha256sum -c -
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo

      - name: Test subscriptions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import base64, concurrent.futures, json, os, pathlib, subprocess, tempfile, time, urllib.parse, urllib.request
          import yaml

          subs = [os.environ.get('SUB_1', ''), os.environ.get('SUB_2', ''), os.environ.get('SUB_3', '')]
          ignored = {'Selector', 'URLTest', 'Fallback', 'LoadBalance', 'Relay', 'Direct', 'Reject', 'Pass', 'Compatible'}
          nba_url = 'https://stats.nba.com/stats/commonteamyears?LeagueID=00'
          trace_url = 'https://www.cloudflare.com/cdn-cgi/trace'

          def delay_test(name, target, timeout_ms):
              encoded_name = urllib.parse.quote(name, safe='')
              query = urllib.parse.urlencode({'url': target, 'timeout': timeout_ms})
              endpoint = f'http://127.0.0.1:9090/proxies/{encoded_name}/delay?{query}'
              try:
                  with urllib.request.urlopen(endpoint, timeout=(timeout_ms / 1000) + 3) as response:
                      result = json.load(response)
                  return name if isinstance(result.get('delay'), int) and result['delay'] > 0 else None
              except Exception:
                  return None

          def parallel_delay(names, target, timeout_ms):
              with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
                  results = pool.map(lambda name: delay_test(name, target, timeout_ms), names)
                  return [name for name in results if name]

          def fetch_nba(port, output_path):
              try:
                  with open(output_path, 'wb') as output:
                      subprocess.run([
                          'curl', '-fsS', '--max-time', '18', '--proxy', f'http://127.0.0.1:{port}',
                          '-H', 'User-Agent: Mozilla/5.0', '-H', 'Referer: https://www.nba.com/', nba_url
                      ], stdout=output, stderr=subprocess.DEVNULL, check=True)
                  document = json.loads(pathlib.Path(output_path).read_text(encoding='utf-8'))
                  sets = document.get('resultSets') or ([document['resultSet']] if document.get('resultSet') else [])
                  return any(isinstance(result_set, dict) and result_set.get('rowSet') for result_set in sets)
              except Exception:
                  return False

          def fetch(url, path):
              req = urllib.request.Request(url, headers={'User-Agent': 'clash.meta', 'Accept': '*/*'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
              pathlib.Path(path).write_bytes(data)

          def decode_config(path):
              raw = pathlib.Path(path).read_bytes()
              try:
                  obj = yaml.safe_load(raw)
                  if isinstance(obj, dict) and isinstance(obj.get('proxies'), list):
                      return obj
              except Exception:
                  pass
              try:
                  decoded = base64.b64decode(raw + b'=' * (-len(raw) % 4))
                  obj = yaml.safe_load(decoded)
                  if isinstance(obj, dict):
                      return obj
              except Exception:
                  pass
              return {}

          for index, url in enumerate(subs, 1):
              if not url:
                  print(f'SUBSCRIPTION {index}: candidates=0 generic=0 nba=0')
                  continue
              with tempfile.TemporaryDirectory(prefix=f'proxy-{index}-') as td:
                  sub_path = os.path.join(td, 'subscription.yaml')
                  try:
                      fetch(url, sub_path)
                      source = decode_config(sub_path)
                  except Exception:
                      print(f'SUBSCRIPTION {index}: candidates=0 generic=0 nba=0')
                      continue
                  proxies = []
                  seen = set()
                  for item in source.get('proxies', []):
                      if not isinstance(item, dict) or not item.get('name') or item.get('type') in ignored:
                          continue
                      if str(item['name']) in seen:
                          continue
                      seen.add(str(item['name']))
                      proxies.append(item)
                  names = [str(p['name']) for p in proxies]
                  if not names:
                      print(f'SUBSCRIPTION {index}: candidates=0 generic=0 nba=0')
                      continue
                  config = {
                      'mixed-port': 7890,
                      'external-controller': '127.0.0.1:9090',
                      'allow-lan': False,
                      'mode': 'rule',
                      'proxies': proxies,
                      'proxy-groups': [{'name': 'diag', 'type': 'select', 'proxies': names}],
                      'listeners': [
                          {'name': f'candidate-{candidate_number}', 'type': 'mixed', 'port': 10000 + candidate_number,
                           'listen': '127.0.0.1', 'proxy': name}
                          for candidate_number, name in enumerate(names)
                      ],
                      'rules': ['MATCH,diag'],
                  }
                  config_path = os.path.join(td, 'config.yaml')
                  pathlib.Path(config_path).write_text(yaml.safe_dump(config, allow_unicode=True, sort_keys=False), encoding='utf-8')
                  log_path = os.path.join(td, 'mihomo.log')
                  proc = subprocess.Popen(['/tmp/mihomo', '-d', td, '-f', config_path], stdout=open(log_path, 'w'), stderr=subprocess.STDOUT)
                  generic_names = []
                  nba = 0
                  try:
                      ready = False
                      for _ in range(30):
                          try:
                              with urllib.request.urlopen('http://127.0.0.1:9090/version', timeout=1):
                                  ready = True
                                  break
                          except Exception:
                              time.sleep(1)
                      if ready:
                          generic_names = parallel_delay(names, trace_url, 7000)
                          nba_jobs = []
                          for name in generic_names:
                              candidate_number = names.index(name)
                              nba_jobs.append((10000 + candidate_number, os.path.join(td, f'nba-{candidate_number}.json')))
                          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
                              nba = sum(pool.map(lambda job: fetch_nba(*job), nba_jobs))
                  finally:
                      proc.terminate()
                      try:
                          proc.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          proc.kill()
                  print(f'SUBSCRIPTION {index}: candidates={len(names)} generic={len(generic_names)} nba={nba}')
          PY
