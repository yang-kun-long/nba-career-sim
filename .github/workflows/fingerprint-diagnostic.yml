name: NBA fingerprint diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUB_URL: ${{ secrets.CLASH_SUBSCRIPTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download Mihomo
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz
          echo 'cf06ce2c7d1421bdbda14ee4a5b6046672dc35ebf8eecd8e77504ec3c0ed9a84  /tmp/mihomo.gz' | sha256sum -c -
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo && chmod +x /tmp/mihomo
      - name: Compare curl fingerprints
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml curl_cffi
          python - <<'PY'
          import base64, concurrent.futures, json, os, pathlib, subprocess, tempfile, time, urllib.request, yaml
          from curl_cffi import requests as cffi

          NBA = 'https://stats.nba.com/stats/commonteamyears?LeagueID=00'
          TRACE = 'https://www.cloudflare.com/cdn-cgi/trace'
          raw = urllib.request.urlopen(urllib.request.Request(os.environ['SUB_URL'], headers={'User-Agent':'clash.meta'}), timeout=30).read()
          try: source = yaml.safe_load(raw)
          except Exception: source = yaml.safe_load(base64.b64decode(raw + b'=' * (-len(raw) % 4)))
          proxies, seen = [], set()
          for p in (source or {}).get('proxies', []):
              if isinstance(p, dict) and p.get('name') and p.get('type') not in {'Selector','URLTest','Fallback','LoadBalance','Relay','Direct','Reject','Pass','Compatible'} and str(p['name']) not in seen:
                  seen.add(str(p['name'])); proxies.append(p)
          proxies = proxies[:20]
          with tempfile.TemporaryDirectory(prefix='fpdiag-') as td:
              listeners = [{'name':f'in-{i}','type':'mixed','port':10000+i,'listen':'127.0.0.1','proxy':str(p['name'])} for i,p in enumerate(proxies)]
              cfg = {'mixed-port':7890,'external-controller':'127.0.0.1:9090','allow-lan':False,'proxies':proxies,'listeners':listeners,'rules':['MATCH,DIRECT']}
              cfgp = pathlib.Path(td)/'config.yaml'; cfgp.write_text(yaml.safe_dump(cfg,allow_unicode=True,sort_keys=False),encoding='utf-8')
              log = open(pathlib.Path(td)/'mihomo.log','w')
              proc = subprocess.Popen(['/tmp/mihomo','-d',td,'-f',str(cfgp)],stdout=log,stderr=subprocess.STDOUT)
              try:
                  ready=False
                  for _ in range(30):
                      try:
                          urllib.request.urlopen('http://127.0.0.1:9090/version',timeout=1); ready=True; break
                      except Exception: time.sleep(1)
                  print(f'CANDIDATES {len(proxies)} READY {int(ready)}')
                  def test_node(item):
                      i, p = item
                      port=10000+i
                      result={'curl':'ERR','cffi':'ERR','ip':'ERR'}
                      try:
                          ip=subprocess.run(['curl','-fsS','--max-time','10','--proxy',f'http://127.0.0.1:{port}',TRACE],capture_output=True,text=True,check=True).stdout
                          result['ip']='OK' if 'ip=' in ip else 'NO'
                      except Exception: pass
                      try:
                          curl_body = pathlib.Path(td) / f'curl-{i}.json'
                          r=subprocess.run(['curl','-sS','-o',str(curl_body),'-w','%{http_code}|%{content_type}|%{size_download}','--max-time','15','--proxy',f'http://127.0.0.1:{port}','-H','User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36','-H','Referer: https://www.nba.com/','-H','Accept: application/json, text/plain, */*',NBA],capture_output=True,text=True)
                          valid = False
                          if curl_body.exists():
                              document = json.loads(curl_body.read_text(encoding='utf-8'))
                              valid = any(result_set.get('rowSet') for result_set in document.get('resultSets', []) if isinstance(result_set, dict))
                          result['curl']=f'{r.stdout.strip() or "ERR"}|json={int(valid)}'
                      except Exception: pass
                      try:
                          r=cffi.get(NBA,proxies={'https':f'http://127.0.0.1:{port}','http':f'http://127.0.0.1:{port}'},impersonate='chrome131',headers={'Referer':'https://www.nba.com/','Accept':'application/json, text/plain, */*'},timeout=15)
                          document = r.json()
                          valid = any(result_set.get('rowSet') for result_set in document.get('resultSets', []) if isinstance(result_set, dict))
                          result['cffi']=f'{r.status_code}|{r.headers.get("content-type","")}|{len(r.content)}|json={int(valid)}'
                      except Exception: pass
                      return i, result
                  with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                      results = sorted(pool.map(test_node, enumerate(proxies)))
                  for i, result in results:
                      print(f'NODE {i+1}: ip={result["ip"]} curl={result["curl"]} cffi={result["cffi"]}')
              finally:
                  proc.terminate(); proc.wait(timeout=8); log.close()
          PY
